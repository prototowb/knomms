# Knowledge Commons — Self-Hosted Deployment
# Zero external service dependencies. All AI inference, storage, and retrieval run on-host.
# Requirements: Docker Compose v2.20+
#
# Quick start:
#   cp .env.example .env          # fill in POSTGRES_PASSWORD, SECRET_KEY, MINIO_ROOT_PASSWORD
#   docker compose up -d db redis minio  # start data services first
#   docker compose run --rm api alembic upgrade head  # run migrations
#   docker compose up -d          # start everything
#
# See docs/05-platform-architecture.md for hardware sizing guidance.
# See docs/08-backend-architecture.md for backend structure.

services:

  # ── PostgreSQL + pgvector ────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge_commons
      POSTGRES_USER: ${POSTGRES_USER:-kc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kc} -d knowledge_commons"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (cache + pub/sub + Streams message queue) ──────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible object storage for raw media) ───────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kc-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Ollama (local LLM inference — generation + embeddings) ───────────────
  # Not required for Milestone 0 (no ingestion/generation in M0).
  # The api service does NOT depend on ollama being healthy at startup.
  # GPU: uncomment the deploy block and set OLLAMA_MODEL to a larger model.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Model warm-up (pulls generation + embedding model on first start) ─────
  # Run manually when ready: docker compose run --rm ollama-init
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c",
      "ollama pull ${OLLAMA_MODEL:-mistral:7b-instruct} && ollama pull nomic-embed-text"]
    restart: "no"

  # ── Application API ───────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # ollama intentionally omitted from deps — not required until Milestone 1
    environment:
      # asyncpg driver required for SQLAlchemy async
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kc}:${POSTGRES_PASSWORD}@db:5432/knowledge_commons
      # sync URL used by Alembic only
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-kc}:${POSTGRES_PASSWORD}@db:5432/knowledge_commons
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-kc-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral:7b-instruct}
      OLLAMA_EMBED_MODEL: nomic-embed-text
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      MAX_CONCURRENT_GENERATIONS: ${MAX_CONCURRENT_GENERATIONS:-2}
    volumes:
      - ./logs:/app/logs

  # ── Ingestion worker (picks up jobs from Redis Streams) ───────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      ollama:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kc}:${POSTGRES_PASSWORD}@db:5432/knowledge_commons
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-kc-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: nomic-embed-text

  # ── Nuxt 3 frontend (Vue 3 + Tailwind CSS + Pinia) ───────────────────────
  # Nuxt server routes act as the Web BFF — no separate BFF service needed.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_SECRET: ${SECRET_KEY}
      NODE_ENV: ${NODE_ENV:-production}
    # Development: override command to use dev server and expose port directly
    # command: npm run dev
    # ports: ["3000:3000"]

  # ── Nginx reverse proxy ───────────────────────────────────────────────────
  # M0: plain HTTP only. TLS (Let's Encrypt) is a deployment concern, not a
  # baseline concern — certbot can't issue for localhost.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  db_data:
  redis_data:
  minio_data:
  ollama_models:
