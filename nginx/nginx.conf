# Knowledge Commons — Nginx reverse proxy
# Milestone 0: plain HTTP. TLS is a deployment concern (certbot/Let's Encrypt)
# added post-baseline when deploying to a real domain.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Disable buffering for SSE (streaming AI responses)
    proxy_buffering off;

    # ── Upstream services ────────────────────────────────────────────────────
    upstream api {
        server api:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # ── Backend API ──────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE: disable buffering and set long timeout
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_cache off;
        }

        # ── API docs (FastAPI Swagger UI + OpenAPI spec) ─────────────────────
        # These paths must NOT have /api/ stripped because FastAPI serves them
        # at the /api/* paths internally (docs_url="/api/docs").
        location /api/docs {
            proxy_pass http://api/api/docs;
            proxy_set_header Host $host;
        }

        location /api/openapi.json {
            proxy_pass http://api/api/openapi.json;
            proxy_set_header Host $host;
        }

        # ── Frontend (Nuxt) ──────────────────────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (presence, ingestion progress)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }
    }
}
