# Knowledge Commons — Nginx reverse proxy
# Architecture: ALL requests go to Nuxt first.
# Nuxt server routes act as the BFF (/api/auth/*, /api/kbs/*, etc.)
# and proxy specific paths to FastAPI via container-to-container calls.
# Only FastAPI Swagger UI docs are served by a direct nginx→FastAPI route.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    proxy_buffering off;

    upstream api {
        server api:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # ── FastAPI Swagger UI (direct — not a BFF path) ─────────────────────
        # FastAPI serves docs at /api/docs internally; nginx must NOT strip the
        # /api prefix for these two paths.
        location /api/docs {
            proxy_pass http://api/api/docs;
            proxy_set_header Host $host;
        }

        location /api/openapi.json {
            proxy_pass http://api/api/openapi.json;
            proxy_set_header Host $host;
        }

        # ── Everything else → Nuxt (BFF + SPA) ──────────────────────────────
        # Nuxt server routes handle /api/* BFF proxying to FastAPI.
        # The /api/v1/* catch-all in Nuxt's server routes also allows direct
        # API access (curl, Swagger) through the BFF.
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Long timeout for SSE (Q&A streaming) and WebSocket
            proxy_read_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
