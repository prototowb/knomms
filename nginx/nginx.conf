# Knowledge Comms — Nginx reverse proxy
# Architecture: ALL requests go to Nuxt first.
# Nuxt server routes act as the BFF (/api/auth/*, /api/kbs/*, etc.)
# and proxy specific paths to FastAPI via container-to-container calls.
# Only FastAPI Swagger UI docs are served by a direct nginx→FastAPI route.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    proxy_buffering off;

    # Docker's internal DNS — re-resolves upstreams every 5s so nginx picks up
    # new container IPs automatically after docker compose up --force-recreate.
    # Variable-based proxy_pass is required for the resolver to take effect.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;
        server_name _;

        # ── FastAPI Swagger UI (direct — not a BFF path) ─────────────────────
        location /api/docs {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream/api/docs;
            proxy_set_header Host $host;
        }

        location /api/openapi.json {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream/api/openapi.json;
            proxy_set_header Host $host;
        }

        # ── Everything else → Nuxt (BFF + SPA) ──────────────────────────────
        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
