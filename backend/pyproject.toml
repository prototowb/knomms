[build-system]
requires = ["setuptools>=68", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "knomms-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",

    # database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",   # sync driver for Alembic

    # validation
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",

    # auth
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=3.0,<4.0",    # passlib's wrap-bug detection breaks with bcrypt>=4

    # redis
    "redis[hiredis]>=5.0",

    # storage
    "miniopy-async>=1.20",

    # http client (also used by Ollama client and web scraper)
    "httpx>=0.27",

    # file upload form parsing (required by FastAPI for UploadFile endpoints)
    "python-multipart>=0.0.9",

    # ingestion — PDF parsing + web scraping (needed by worker image)
    "pdfminer.six>=20221105",
    "html2text>=2024.2.26",
]

[project.optional-dependencies]
# Milestone 1 extras already in base deps above; this alias installs base + below
ingestion = [
    "python-docx>=1.1",
    "youtube-transcript-api>=0.6",
    # Playwright added when JS-rendered web extraction is needed (M2+)
    # "playwright>=1.44",
]
# Milestone 2+ — not needed for M0
ai = [
    "sentence-transformers>=3.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=1.0",
]
server = []   # alias used by Dockerfile — installs base deps only
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "worker*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
